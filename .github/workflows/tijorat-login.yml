# Tijorat+ fork: checks the Login UI v2 changes and publishes the branded login image.
# See TIJORAT_FORK.md. Upstream workflows are left untouched.
name: Tijorat+ Login

on:
  push:
    branches:
      - "tijorat/**"
      - "claude/**"
    tags:
      - "tijorat-v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # The branded build depends on NEXT_PUBLIC_* variables, which Nx does not hash: never reuse a cache.
  NX_NO_CLOUD: "true"
  NX_SKIP_NX_CACHE: "true"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@zitadel/login..."
      # Compare against zitadel/zitadel itself: the fork's main already contains the fork's changes.
      - name: Fetch upstream ZITADEL
        run: git fetch --no-tags https://github.com/zitadel/zitadel.git main:refs/remotes/upstream/main
      - name: Every modified upstream file is declared
        run: scripts/tijorat/upstream-diff.sh upstream/main
      - name: Lint
        run: pnpm nx run --nxBail @zitadel/login:lint
      # Unit tests run with the stock theme defaults, as upstream's tests expect them.
      - name: Unit tests
        run: pnpm nx run --nxBail @zitadel/login:test-unit
      - name: Build the branded login
        run: pnpm nx run --nxBail @zitadel/login:build
        env:
          # Build-time switches, inlined by `next build` (TIJORAT_FORK.md, "Настройка").
          NEXT_PUBLIC_TIJORAT_BRAND: "true"
          NEXT_PUBLIC_BASE_PATH: /ui/v2/login
          NEXT_PUBLIC_THEME_LAYOUT: side-by-side
          NEXT_PUBLIC_THEME_ROUNDNESS: mid
          NEXT_PUBLIC_THEME_APPEARANCE: flat
          NEXT_PUBLIC_AUTO_SUBMIT_CODE: "true"
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zitadel-login
          labels: |
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
      - name: Build and push the login image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          platforms: linux/amd64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
